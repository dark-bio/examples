name: checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  # Pull requests build against the versions the documentation names, so a red
  # build means the change broke something rather than the world moving.
  compiled:
    name: Rust, Go and C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchains
        with:
          wasmtime: "48.0.2"
          binaryen: "132"
          wasi-sdk: "33.0"
          tinygo: "0.42.0"

      - name: Build, run and compare
        run: sh tools/check.sh $(ls apps | grep -v -- '-python$')

  # Kept apart from the job above so a broken interpreter build doesn't hide
  # whether the other three languages still work. The Rust versions come along
  # because the comparison needs something to compare against.
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchains
        with:
          wasmtime: "48.0.2"
          binaryen: "132"
          wasi-sdk: "33.0"

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.14"

      # The build compiles an interpreter to match this one, which takes minutes,
      # so every run that finds the same version and build tool reuses it.
      - uses: actions/cache@v4
        with:
          path: build/python
          key: cpython-${{ steps.python.outputs.python-version }}-${{ hashFiles('tools/python_build.py', 'tools/python_embed.c') }}

      - name: Build, run and compare
        run: sh tools/check.sh $(ls apps | grep -E -- '-(python|rust)$')

  # The documentation tells readers that newer toolchains usually work. This
  # tests that claim nightly, against whatever those projects have released,
  # with no cached interpreter so CPython is built from source as a reader
  # would. Only wasi-sdk stays fixed, since a new one moves the sysroot the
  # interpreter compiles against.
  latest:
    name: Newest toolchains
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the newest releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "wasmtime=$(gh release view --repo bytecodealliance/wasmtime --json tagName --jq '.tagName | ltrimstr("v")')"
            echo "binaryen=$(gh release view --repo WebAssembly/binaryen --json tagName --jq '.tagName | ltrimstr("version_")')"
            echo "tinygo=$(gh release view --repo tinygo-org/tinygo --json tagName --jq '.tagName | ltrimstr("v")')"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/toolchains
        with:
          wasmtime: ${{ steps.releases.outputs.wasmtime }}
          binaryen: ${{ steps.releases.outputs.binaryen }}
          wasi-sdk: "33.0"
          tinygo: ${{ steps.releases.outputs.tinygo }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build, run and compare
        run: sh tools/check.sh
